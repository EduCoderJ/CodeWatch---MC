<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox - Teste de Front-end</title>
    <!-- Tailwind CSS CDN para estilização ágil -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos CSS customizados adicionais se necessário */
        .custom-glow {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.15);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between p-6">

    <!-- Header de Teste -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center border-b border-gray-800 pb-4">
        <div>
            <h1 class="text-xl font-black text-emerald-400 tracking-wider">LABORATÓRIO FRONT-END</h1>
            <p class="text-xs text-gray-500">Ambiente de testes isolado (Sandbox)</p>
        </div>
        <span class="bg-amber-950/80 text-amber-400 border border-amber-800 text-xs px-3 py-1 rounded-full font-mono">Modo Teste</span>
    </header>

    <!-- Conteúdo Principal do Teste -->
    <main class="max-w-4xl mx-auto w-full my-12 flex-1 flex flex-col justify-center">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 custom-glow">
            <h2 class="text-2xl font-bold mb-4 text-white">Protótipo de Interface</h2>
            <p class="text-gray-400 text-sm mb-6">Usa este espaço para testar componentes visuais, botões, formulários e layouts antes de aplicar na estrutura oficial do projeto.</p>
            
            <!-- Área interativa de teste -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-mono uppercase text-gray-400 mb-2">Simular Entrada de Dados</label>
                    <input type="text" placeholder="Digite algo para testar..." class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <button class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-lg text-sm transition-all shadow-lg shadow-emerald-900/30">
                    Testar Ação
                </button>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="max-w-4xl mx-auto w-full text-center text-xs text-gray-600 border-t border-gray-900 pt-4">
        Sandbox isolado &bull; Sem alterações na branch principal por enquanto
    </footer>

</body>
</html>
