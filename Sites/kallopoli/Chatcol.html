<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kallopolli - Chat Colaborador RH</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Scrollbar personalizada no estilo WhatsApp Dark */
    #chat-container::-webkit-scrollbar {
      width: 6px;
    }
    #chat-container::-webkit-scrollbar-track {
      background: transparent;
    }
    #chat-container::-webkit-scrollbar-thumb {
      background: #374248;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-[#0b141a] text-gray-100 h-screen flex flex-col justify-between font-sans antialiased">

  <!-- Cabeçalho do Chat -->
  <header class="bg-[#202c33] px-4 py-3 flex items-center justify-between shadow-md border-b border-[#2a3942] z-10">
    <div class="flex items-center space-x-3">
      <div class="relative">
        <div class="w-10 h-10 rounded-full bg-[#005c4b] flex items-center justify-center font-bold text-white text-sm shadow">
          KP
        </div>
        <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-[#202c33] rounded-full"></span>
      </div>
      <div>
        <h1 class="text-sm font-semibold text-gray-100 leading-tight">Kallopolli - Suporte RH</h1>
        <span class="text-xs text-emerald-400 font-medium">online</span>
      </div>
    </div>
    
    <!-- Ícones Decorativos WhatsApp -->
    <div class="flex items-center space-x-4 text-gray-400">
      <button class="hover:text-gray-200 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </button>
      <button class="hover:text-gray-200 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
      </button>
    </div>
  </header>

  <!-- Container de Mensagens -->
  <main id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3 bg-[#0b141a] bg-opacity-95">
    
    <!-- Mensagem Inicial de Boas-Vindas -->
    <div class="flex flex-col items-start max-w-[85%] sm:max-w-[65%]">
      <div class="bg-[#202c33] text-gray-200 text-xs sm:text-sm px-3.5 py-2.5 rounded-lg rounded-tl-none shadow border border-[#2a3942] relative">
        <p class="leading-relaxed">Olá! Envia o teu relato ou questão para registarmos no sistema do RH.</p>
        <span class="text-[10px] text-gray-400 block text-right mt-1 font-mono">Agora</span>
      </div>
    </div>

  </main>

  <!-- Rodapé / Barra de Input -->
  <footer class="bg-[#202c33] p-3 flex items-center space-x-3 border-t border-[#2a3942] z-10">
    <input 
      id="user-input" 
      type="text" 
      placeholder="Escreve a tua mensagem..." 
      class="flex-1 bg-[#2a3942] text-gray-100 text-sm rounded-lg px-4 py-3 focus:outline-none focus:ring-1 focus:ring-[#00a884] placeholder-gray-400 transition"
      autocomplete="off"
    >
    <button 
      onclick="enviarMensagem()" 
      class="bg-[#00a884] hover:bg-[#008f72] active:scale-95 text-white px-5 py-3 rounded-lg text-sm font-semibold transition duration-150 shadow flex items-center justify-center">
      <span>Enviar</span>
    </button>
  </footer>

  <!-- Script JavaScript -->
  <script>
    const input = document.getElementById('user-input');
    const container = document.getElementById('chat-container');
    const API_URL = "http://localhost:8000";

    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') enviarMensagem();
    });

    async function enviarMensagem() {
      const texto = input.value.trim();
      if (!texto) return;

      const horaAtual = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Append da mensagem do colaborador (Lado Direito)
      const msgUsuarioHTML = `
        <div class="flex flex-col items-end max-w-[85%] sm:max-w-[65%] ml-auto">
          <div class="bg-[#005c4b] text-white text-xs sm:text-sm px-3.5 py-2.5 rounded-lg rounded-tr-none shadow relative">
            <p class="leading-relaxed break-words">${escapeHTML(texto)}</p>
            <div class="flex items-center justify-end space-x-1 mt-1">
              <span class="text-[10px] text-emerald-200 font-mono">${horaAtual}</span>
              <span class="text-emerald-300 text-[11px]">✓✓</span>
            </div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', msgUsuarioHTML);
      input.value = '';
      container.scrollTop = container.scrollHeight;

      // Indicator de "Digitando..."
      const idCarregamento = "loading-" + Date.now();
      const msgLoadingHTML = `
        <div id="${idCarregamento}" class="flex flex-col items-start max-w-[85%] sm:max-w-[65%]">
          <div class="bg-[#202c33] text-gray-400 text-xs px-3.5 py-2 rounded-lg italic border border-[#2a3942] flex items-center space-x-2">
            <span class="w-2 h-2 bg-[#00a884] rounded-full animate-ping"></span>
            <span>Digitando parecer do RH...</span>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', msgLoadingHTML);
      container.scrollTop = container.scrollHeight;

      try {
        const respostaBackend = await fetch(`${API_URL}/api/whatsapp/webhook`, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            remetente: "5551999887766",
            mensagem: texto
          })
        });

        // Remove o indicador de carregamento
        const elLoading = document.getElementById(idCarregamento);
        if (elLoading) elLoading.remove();

        if (!respostaBackend.ok) {
          throw new Error(`Erro HTTP: ${respostaBackend.status}`);
        }

        const dados = await respostaBackend.json();

        let respostaBot = "Recebido e registrado no sistema do RH.";
        if (dados.sucesso && dados.parecer_rh) {
          respostaBot = dados.parecer_rh;
        }

        // Resposta da IA / Backend (Lado Esquerdo)
        const msgBotHTML = `
          <div class="flex flex-col items-start max-w-[85%] sm:max-w-[65%]">
            <div class="bg-[#202c33] text-gray-200 text-xs sm:text-sm px-3.5 py-2.5 rounded-lg rounded-tl-none shadow border border-[#2a3942] relative">
              <p class="leading-relaxed break-words">${escapeHTML(respostaBot)}</p>
              <span class="text-[10px] text-gray-400 block text-right mt-1 font-mono">${horaAtual}</span>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', msgBotHTML);

      } catch (err) {
        const elLoading = document.getElementById(idCarregamento);
        if (elLoading) elLoading.remove();

        const msgErroHTML = `
          <div class="flex flex-col items-start max-w-[85%] sm:max-w-[65%]">
            <div class="bg-[#202c33] text-red-400 text-xs sm:text-sm px-3.5 py-2.5 rounded-lg rounded-tl-none border border-red-900/50 shadow space-y-1">
              <p><b>Falha na conexão com o FastAPI:</b> ${escapeHTML(err.message)}</p>
              <p class="text-[10px] text-gray-400">Confirma se o Uvicorn está a rodar na porta 8000.</p>
              <span class="text-[10px] text-gray-400 block text-right font-mono">${horaAtual}</span>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', msgErroHTML);
      }

      container.scrollTop = container.scrollHeight;
    }

    // Função de sanitização contra XSS
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>
