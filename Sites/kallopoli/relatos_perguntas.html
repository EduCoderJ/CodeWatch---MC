<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dúvidas do RH - Kallopoli</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #fad325;
      color: #222;
      padding: 16px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    main {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .barra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .botao {
      padding: 8px 14px;
      background: #c81018;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }

    .botao:hover {
      background: #a00d13;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #eee;
    }

    #aviso {
      padding: 20px;
      background: white;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Dúvidas sem resposta</h1>
  </header>

  <main>
    <div class="barra">
      <span id="contagem">Carregando...</span>
      <a href="index.html" class="botao">Urgentes</a>
    </div>

    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Colaborador</th>
          <th>Dúvida</th>
          <th>Situação</th>
        </tr>
      </thead>
      <tbody id="lista"></tbody>
    </table>

    <p id="aviso" hidden></p>
  </main>

  <script>
    
    const URL_JAVA = "http://localhost:8080/api/relatos";

    const CATEGORIA_DUVIDA = "duvida_sem_resposta";

    function carregar() {
      fetch(URL_JAVA)
        .then(resposta => resposta.json())
        .then(relatos => mostrar(relatos))
        .catch(() => {
          document.getElementById("lista").innerHTML = "";
          document.getElementById("contagem").textContent = "Sem conexão com o Java";
          mostrarAviso("Não consegui buscar as dúvidas. Confira se o Java está rodando.");
        });
    }

    function mostrar(relatos) {

      const duvidas = relatos.filter(r => r.categoria === CATEGORIA_DUVIDA);

      const lista = document.getElementById("lista");
      lista.innerHTML = "";

      document.getElementById("contagem").textContent = duvidas.length + " dúvida(s)";

      if (duvidas.length === 0) {
        mostrarAviso("Nenhuma dúvida sem resposta por enquanto.");
        return;
      }

      document.getElementById("aviso").hidden = true;

      duvidas.forEach(duvida => {
        const data = duvida.criadoEm ? new Date(duvida.criadoEm).toLocaleString("pt-BR") : "";

        const linha = document.createElement("tr");
        linha.appendChild(criarCelula(data));
        linha.appendChild(criarCelula(duvida.nomeColaborador || "-"));
        linha.appendChild(criarCelula(duvida.resumo || ""));
        linha.appendChild(criarCelula(duvida.situacao || "-"));

        lista.appendChild(linha);
      });
    }


    function criarCelula(texto) {
      const celula = document.createElement("td");
      celula.textContent = texto;
      return celula;
    }

    function mostrarAviso(texto) {
      const aviso = document.getElementById("aviso");
      aviso.textContent = texto;
      aviso.hidden = false;
    }

    carregar();
    setInterval(carregar, 10000); 
  </script>

</body>
</html>
