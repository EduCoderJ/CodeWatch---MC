spring.application.name=parceiro90

spring.datasource.url=jdbc:postgresql://localhost:5432/parceiro90
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# stub = regras simples por palavra-chave | gemini = chama o Gemini
app.ia-modo=stub
app.gemini-url=https://generativelanguage.googleapis.com
app.gemini-key=${GEMINI_API_KEY:}
# CONFIRME o nome do modelo no Google AI Studio (os nomes mudam)
app.gemini-modelo=gemini-3.6-flash

app.evolution-ativo=false
app.evolution-url=http://localhost:8081
app.evolution-key=${EVOLUTION_KEY:}
app.evolution-instance=parceiro90

app.lembrete-horas=24